name: Feature request
description: Propose a capability or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to build that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. A planner skill, a language for symbol extraction, a search option, an API shape or a UI sketch are all welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
