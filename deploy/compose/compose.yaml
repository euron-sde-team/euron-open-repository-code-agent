# Euron CodeAgent: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways.
#
# Host ports (override in .env if they clash with something you already run):
#   web 3190   api 8190   postgres 5459   valkey 6419   floci 4619
name: codeagent

x-app-env: &app-env
  # Development mode: the local stack talks to an emulator and links to localhost, both of
  # which production refuses on purpose (Settings.production_problems).
  APP_ENV: development
  TZ: UTC
  LOG_LEVEL: ${CODEAGENT_LOG_LEVEL:-info}
  LOG_FORMAT: json
  PRODUCT_NAME: ${CODEAGENT_PRODUCT_NAME:-Euron CodeAgent}
  DATABASE_URL: postgresql+asyncpg://codeagent:codeagent@postgres:5432/codeagent
  REDIS_URL: redis://valkey:6379/0
  SESSION_SECRET: ${CODEAGENT_SESSION_SECRET:?run `make env` first}
  API_KEY_PEPPER: ${CODEAGENT_API_KEY_PEPPER:?run `make env` first}
  CORS_ORIGINS: http://localhost:${CODEAGENT_WEB_PORT:-3190},http://127.0.0.1:${CODEAGENT_WEB_PORT:-3190}
  WEB_URL: http://localhost:${CODEAGENT_WEB_PORT:-3190}
  API_URL: http://localhost:${CODEAGENT_API_PORT:-8190}
  # Answers and the agent: "none" is the offline local answerer and planner, no model
  # needed. For a model, set CODEAGENT_LLM_PROVIDER=ollama (Ollama on this machine) or
  # openai (any OpenAI-compatible API) and CODEAGENT_LLM_MODEL in .env.
  LLM_PROVIDER: ${CODEAGENT_LLM_PROVIDER:-none}
  LLM_MODEL: ${CODEAGENT_LLM_MODEL:-}
  LLM_BASE_URL: ${CODEAGENT_LLM_BASE_URL:-https://api.openai.com/v1}
  LLM_API_KEY: ${CODEAGENT_LLM_API_KEY:-}
  OLLAMA_URL: ${CODEAGENT_OLLAMA_URL:-http://host.docker.internal:11434}
  # Private hosts are allowed so a git server on this machine can be connected locally.
  ALLOW_PRIVATE_GIT_HOSTS: ${CODEAGENT_ALLOW_PRIVATE_GIT_HOSTS:-false}

x-api-image: &api-image
  build:
    context: ../..
    dockerfile: infra/docker/api.Dockerfile
  image: codeagent-api:local

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_DB: codeagent
      POSTGRES_USER: codeagent
      POSTGRES_PASSWORD: codeagent
    ports:
      - "127.0.0.1:${CODEAGENT_PG_PORT:-5459}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeagent -d codeagent"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Embedding and highlighting caches, rate limits, locks and signed-out sessions. No
  # eviction policy: a revoked session must never be forgotten early.
  valkey:
    image: valkey/valkey:8.1.10-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${CODEAGENT_REDIS_PORT:-6419}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    <<: *api-image
    environment:
      <<: *app-env
      MIGRATE_ON_BOOT: "true"
    ports:
      - "127.0.0.1:${CODEAGENT_API_PORT:-8190}:8080"
    tmpfs:
      - /tmp:uid=10001,gid=10001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped

  # Indexes repositories, runs the agent, runs tests and applies approved patches, taking
  # jobs from the queue. It talks to the Docker engine to start one throwaway sandbox
  # container per test run (networking disabled, cgroup limits); see
  # docs/architecture/security.md for what that socket grants and why it is acceptable on
  # a developer machine.
  worker:
    <<: *api-image
    command: ["python", "-m", "codeagent.worker"]
    environment:
      <<: *app-env
      WORKER_METRICS_PORT: "9100"
      SANDBOX_BACKEND: ${CODEAGENT_SANDBOX_BACKEND:-auto}
      SANDBOX_IMAGE: codeagent-sandbox:local
    group_add:
      - "${CODEAGENT_DOCKER_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /tmp:uid=10001,gid=10001,size=2g
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3
    depends_on:
      # The API applies the migrations on boot; the worker starts once they are in.
      api:
        condition: service_healthy
      sandbox-image:
        condition: service_completed_successfully
    restart: unless-stopped

  # Builds the image every sandboxed test run starts in, then exits. The worker waits for it,
  # so the first run never fails on a missing image.
  sandbox-image:
    build:
      context: ../..
      dockerfile: infra/docker/sandbox.Dockerfile
    image: codeagent-sandbox:local
    command: ["python", "--version"]
    restart: "no"

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    image: codeagent-web:local
    environment:
      # The browser calls the API directly, so this is the host-facing address.
      API_URL: http://localhost:${CODEAGENT_API_PORT:-8190}
      PRODUCT_NAME: ${CODEAGENT_PRODUCT_NAME:-Euron CodeAgent}
    ports:
      - "127.0.0.1:${CODEAGENT_WEB_PORT:-3190}:8080"
    restart: unless-stopped

volumes:
  pgdata:
