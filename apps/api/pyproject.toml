[project]
name = "codeagent"
version = "0.1.0"
description = "Euron CodeAgent API and worker: a repository-aware coding assistant with a code index, search, cited answers, sandboxed tests and reviewed patches."
readme = "README.md"
license = "MIT"
authors = [{ name = "ENGAGESPHERE TECHNOLOGY PRIVATE LIMITED" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.161,<0.200",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.1.6,<2.2",
  "asyncpg>=0.32",
  "alembic>=1.20",
  "pgvector>=0.5.1",
  "redis>=8.1",
  "httpx>=0.28.1",
  "structlog>=26.1",
  "orjson>=3.13",
  "prometheus-client>=0.26",
  "boto3>=1.43",
  "argon2-cffi>=25.1",
  "pyjwt>=2.15",
  "python-multipart>=0.0.32",
  "typer>=0.27",
  "numpy>=2.5",
  "pygments>=2.21",
  "tree-sitter>=0.26",
  "tree-sitter-javascript>=0.25",
  "tree-sitter-typescript>=0.23.2",
  "tree-sitter-go>=0.25",
  "defusedxml>=0.7.1",
]

[project.scripts]
codeagent = "codeagent.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "pytest-cov>=7.1",
  "respx>=0.23",
  "fakeredis>=2.40",
  "ruff>=0.17",
  "mypy>=2.4",
  "boto3-stubs[s3,sqs,secretsmanager]>=1.43",
  "types-pygments",
  "types-defusedxml",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeagent"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# The bundled demo repositories are sample projects, not part of this package's style.
extend-exclude = ["src/codeagent/demo/repos"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "SIM", "C4", "RUF", "ASYNC", "PT", "RET", "PIE", "PERF", "TID"]
ignore = [
  "S311",   # random is used for jitter, never for secrets
  "RUF012", # SQLAlchemy and Pydantic class attributes are not mutable defaults
  "B008",   # FastAPI dependencies are declared as default arguments by design
  "S603",   # subprocess calls take argument lists built by this code, never a shell string
  "S607",   # git and python are resolved from PATH on purpose (the image pins both)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "PLR2004", "E501"]
"src/codeagent/migrations/**" = ["E501"]
"src/codeagent/agent/catalog.py" = ["E501"]  # helper sources and their tests are data
"src/codeagent/sandbox/docker.py" = ["S108"]  # /tmp there is the container's private tmpfs

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["codeagent"]
exclude = ["src/codeagent/demo/repos/"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pgvector.*", "tree_sitter_javascript.*", "tree_sitter_typescript.*", "tree_sitter_go.*"]
ignore_missing_imports = true

# Alembic revisions are frozen history written against SQLAlchemy's untyped op API.
[[tool.mypy.overrides]]
module = ["codeagent.migrations.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Integration tests need real services: `make test-integration` selects them with -m.
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
  "integration: needs Postgres (pgvector), Valkey and the AWS emulator (make test-integration)",
  "docker: needs a reachable Docker engine and the sandbox image (skipped otherwise)",
]
filterwarnings = ["ignore::DeprecationWarning:botocore.*"]

[tool.coverage.run]
source = ["codeagent"]
branch = true
omit = ["src/codeagent/demo/repos/*"]

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
